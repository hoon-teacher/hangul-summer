<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>여름방학 한글 교실</title>
<!-- 아이패드: 홈 화면에 추가하면 앱처럼 전체화면으로 열립니다 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한글 교실">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23FF8A3D'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle' fill='white' font-family='sans-serif'%3E%EA%B0%80%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF4FB; --card:#FFFFFF; --ink:#1F3A5F; --sub:#6B7C93;
    --accent:#FF8A3D; --accent-dark:#E9731F; --mint:#2FB894; --line:#D8E2EF;
    --guide:#DCE5F0; --star:#FFC53D; --wrong:#E45B5B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Gowun Dodum',sans-serif; min-height:100vh;}
  h1,h2,h3,.jua{font-family:'Jua',sans-serif; font-weight:400;}
  button{font-family:inherit; border:none; cursor:pointer;}
  .wrap{max-width:900px; margin:0 auto; padding:20px 16px 60px;}

  /* 홈 */
  .home-head{text-align:center; margin:12px 0 22px;}
  .home-head h1{font-size:34px; margin:0;}
  .home-head p{color:var(--sub); margin:6px 0 0; font-size:16px;}
  .day-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .day-card{background:var(--card); border:2px solid var(--line); border-radius:20px; padding:18px 16px; text-align:left; position:relative; transition:transform .1s;}
  .day-card:active{transform:scale(.97);}
  .day-card .dnum{display:inline-block; background:var(--ink); color:#fff; border-radius:10px; padding:3px 10px; font-size:14px; font-family:'Jua';}
  .day-card h3{margin:10px 0 4px; font-size:21px;}
  .day-card p{margin:0; color:var(--sub); font-size:14px;}
  .day-card .meta{margin-top:8px; font-size:13px; color:var(--sub);}
  .stamp{position:absolute; top:10px; right:10px; width:58px; height:58px; border-radius:50%;
    border:3px solid var(--wrong); color:var(--wrong); display:flex; align-items:center; justify-content:center;
    font-family:'Jua'; font-size:13px; transform:rotate(-14deg); background:rgba(255,255,255,.7);
    line-height:1.1; text-align:center;}
  .teacher-link{display:block; margin:26px auto 0; background:none; color:var(--sub); font-size:14px; text-decoration:underline;}

  /* 공통 */
  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .back-btn{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:8px 14px; font-size:16px; color:var(--ink);}
  .topbar h2{margin:0; font-size:22px; flex:1;}
  .steps{display:flex; gap:5px; margin-bottom:6px;}
  .step-dot{flex:1; height:14px; border-radius:8px; background:var(--line); border:none; padding:0; cursor:pointer;}
  .step-dot.on{background:#FFC79A;}
  .step-dot.now{background:var(--accent); box-shadow:0 0 0 3px rgba(255,138,61,.25);}
  .step-caption{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; flex-wrap:wrap; gap:6px;}
  .step-name{font-family:'Jua'; font-size:17px; color:var(--ink);}
  .step-tip{font-size:13px; color:var(--sub);}

  /* 받아쓰기 도움 */
  .dict-bar{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  .syl-count{background:#F1F5FA; border:2px solid var(--line); border-radius:999px; padding:7px 15px; font-family:'Jua'; font-size:16px;}
  .hint-bar{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .hint-label{font-size:14px; color:var(--sub); margin-right:2px;}
  .panel{background:var(--card); border:2px solid var(--line); border-radius:22px; padding:22px 20px;}
  .panel h3{margin:0 0 4px; font-size:24px;}
  .panel .hint{color:var(--sub); font-size:15px; margin:0 0 16px; line-height:1.6;}
  .btn{background:var(--accent); color:#fff; border-radius:16px; padding:14px 26px; font-size:20px; font-family:'Jua'; box-shadow:0 3px 0 var(--accent-dark);}
  .btn:active{transform:translateY(2px); box-shadow:none;}
  .btn.ghost{background:#F1F5FA; color:var(--ink); box-shadow:0 3px 0 var(--line);}
  .btn.mint{background:var(--mint); box-shadow:0 3px 0 #219478;}
  .btn.sm{font-size:16px; padding:10px 18px;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; align-items:center;}
  .chip{border-radius:999px; padding:8px 16px; font-size:15px; background:#F1F5FA; border:2px solid var(--line); color:var(--ink);}
  .chip.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .toggle-row{display:flex; gap:8px; align-items:center; margin:8px 0 16px; flex-wrap:wrap;}

  /* 낱말 카드 */
  .word-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .wcard{background:#F8FAFD; border:2px solid var(--line); border-radius:18px; padding:22px 10px; font-family:'Jua'; font-size:26px; color:var(--ink);}
  .wcard.read{background:#E9F7F2; border-color:var(--mint);}
  .wcard:active{transform:scale(.96);}

  /* 읽기 */
  .sentence{font-size:26px; line-height:1.95; padding:8px 12px; border-radius:14px;}
  .sentence.active{background:#FFF3E4;}
  .sentence .num{color:var(--sub); font-size:16px; margin-right:8px;}
  .sentence .slash{color:var(--accent); font-weight:bold; margin:0 3px;}
  .listen-btn{background:#F1F5FA; border:2px solid var(--line); border-radius:12px; padding:4px 12px; font-size:16px; margin-left:8px; vertical-align:middle; color:var(--ink);}

  /* 타이머 */
  .timer{font-family:'Jua'; font-size:54px; text-align:center; margin:8px 0;}
  .round-row{display:flex; justify-content:center; gap:10px; margin-bottom:10px;}
  .round-pill{padding:8px 16px; border-radius:999px; background:#F1F5FA; border:2px solid var(--line); font-size:15px; font-family:'Jua';}
  .round-pill.now{border-color:var(--accent); background:#FFF3E4;}
  .round-pill.done{background:var(--mint); color:#fff; border-color:var(--mint);}
  .counter{display:flex; align-items:center; justify-content:center; gap:16px; margin:12px 0 2px;}
  .counter button{width:56px; height:56px; border-radius:50%; font-size:28px; background:#F1F5FA; border:2px solid var(--line); color:var(--ink);}
  .counter .cnum{font-family:'Jua'; font-size:34px; min-width:60px; text-align:center;}
  .counter-label{text-align:center; color:var(--sub); font-size:15px;}

  /* 퀴즈 */
  .quiz-q{font-family:'Jua'; font-size:23px; margin:0 0 12px;}
  .quiz-opts{display:grid; gap:10px;}
  .opt{text-align:left; background:#F8FAFD; border:2px solid var(--line); border-radius:16px; padding:16px 18px; font-size:20px; color:var(--ink);}
  .opt.correct{background:#E9F7F2; border-color:var(--mint);}
  .opt.wrong{background:#FDECEC; border-color:var(--wrong);}
  .quiz-feedback{font-family:'Jua'; font-size:22px; margin-top:14px; min-height:30px;}
  .quiz-progress{color:var(--sub); font-size:15px; margin-bottom:6px;}

  /* 쓰기 */
  .write-title{text-align:center; font-family:'Jua'; font-size:25px; margin-bottom:10px; line-height:1.5;}
  .canvas-box{border:2px dashed var(--line); border-radius:16px; overflow:hidden; background:#fff; touch-action:none;}
  canvas{display:block; width:100%;}
  .word-nav{display:flex; justify-content:center; gap:8px; margin:0 0 12px; flex-wrap:wrap;}
  .word-pill{padding:6px 13px; border-radius:999px; background:#F1F5FA; border:2px solid var(--line); font-size:16px; color:var(--ink);}
  .word-pill.done{background:var(--mint); color:#fff; border-color:var(--mint);}
  .word-pill.now{border-color:var(--accent); background:#FFF3E4;}
  .answer-box{margin-top:12px; text-align:center; font-family:'Jua'; font-size:26px; color:var(--mint); min-height:34px;}

  /* 완료 */
  .finish{text-align:center; padding:26px 0;}
  .big-stamp{width:150px; height:150px; margin:0 auto 16px; border-radius:50%; border:6px solid var(--wrong);
    color:var(--wrong); display:flex; align-items:center; justify-content:center; font-family:'Jua'; font-size:26px;
    transform:rotate(-12deg); animation:stampIn .5s cubic-bezier(.2,1.6,.4,1);}
  @keyframes stampIn{from{transform:scale(2.4) rotate(-12deg); opacity:0;} to{transform:scale(1) rotate(-12deg); opacity:1;}}
  .stars{font-size:40px; letter-spacing:6px; margin:6px 0 14px; color:var(--star);}
  .result-list{display:inline-block; text-align:left; font-size:17px; line-height:2; color:var(--sub);}

  /* 교사 기록 */
  table{width:100%; border-collapse:collapse; font-size:15px;}
  th,td{padding:10px 6px; border-bottom:1px solid var(--line); text-align:center;}
  th{color:var(--sub); font-weight:normal;}
  .notice{background:#FFF7E8; border:2px solid #F5DFAE; color:#8A6D1E; border-radius:14px; padding:12px 14px; font-size:14px; margin-bottom:14px; line-height:1.7;}

  /* 목소리 설정 */
  .voice-row{display:flex; justify-content:space-between; align-items:center; width:100%;
    background:#F8FAFD; border:2px solid var(--line); border-radius:16px; padding:15px 18px; margin-bottom:10px; color:var(--ink);}
  .voice-row.on{background:#E9F7F2; border-color:var(--mint);}
  .vname{font-family:'Jua'; font-size:19px;}
  .vpick{font-size:15px; color:var(--sub);}
  .voice-row.on .vpick{color:var(--mint);}
  .tag{background:var(--mint); color:#fff; border-radius:8px; padding:2px 8px; font-size:13px; margin-left:6px;}
  .slider-row{display:flex; align-items:center; gap:12px; font-size:15px; color:var(--sub);}
  .slider-row input{flex:1; height:34px;}

  /* 로그인 */
  .nick-input{width:100%; font-family:'Jua'; font-size:26px; text-align:center; padding:14px;
    border:2px solid var(--line); border-radius:16px; color:var(--ink); background:#F8FAFD;
    -webkit-user-select:text; user-select:text;}
  .nick-input:focus{outline:none; border-color:var(--accent); background:#fff;}
  .mini-link{background:none; color:var(--sub); font-size:13px; text-decoration:underline; margin-left:8px;}
  .stamp-row{font-size:26px; letter-spacing:4px; margin-top:8px;}

  /* 읽기 조작 바 */
  .control-bar{background:#F8FAFD; border:2px solid var(--line); border-radius:18px;
    padding:14px 16px 10px; margin-bottom:18px; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .control-bar .timer{margin:0; font-size:48px;}
  .control-bar .counter{margin:6px 0 0;}
  .control-bar .counter button{width:48px; height:48px; font-size:24px;}

  /* 읽기 결과 그래프 */
  .bars{margin:10px 0 18px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .bar-label{font-family:'Jua'; font-size:18px; width:44px;}
  .bar-track{flex:1; background:#F1F5FA; border-radius:10px; height:32px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:10px; transition:width .6s;}
  .bar-fill.best{background:var(--mint);}
  .bar-time{font-family:'Jua'; font-size:18px; width:60px; text-align:right;}
  .result-msg{text-align:center; font-family:'Jua'; font-size:22px; color:var(--ink); margin:6px 0 4px; line-height:1.6;}
</style>
<style>
  .day-card .meta{margin-top:6px;}
  .step-dot.p1{--pc:#FF8A3D;} .step-dot.p2{--pc:#2FB894;} .step-dot.p3{--pc:#7C6BD6;}
  .step-dot.on{background:color-mix(in srgb, var(--pc) 45%, white);}
  .step-dot.now{background:var(--pc); box-shadow:0 0 0 3px color-mix(in srgb, var(--pc) 25%, transparent);}
  .period-badge{font-family:'Jua'; font-size:14px; color:#fff; border-radius:8px; padding:3px 10px; margin-right:8px;}
  .period-badge.p1{background:#FF8A3D;} .period-badge.p2{background:#2FB894;} .period-badge.p3{background:#7C6BD6;}
  .cloze-sentence{font-family:'Jua'; font-size:26px; line-height:1.9; margin:6px 0 16px; text-align:center;}
  .blank{color:var(--accent); letter-spacing:-2px;}

  /* 캔버스 2겹 (안내선 + 글씨) */
  .canvas-box{position:relative;}
  .canvas-box canvas{display:block; width:100%; position:absolute; top:0; left:0;}
  .canvas-box #guide{z-index:0;}
  .canvas-box #pad{z-index:1; touch-action:none;}

  /* 도구 */
  .tool-bar{display:flex; gap:8px; justify-content:center; margin:0 0 12px; flex-wrap:wrap;}
  .tool-btn{background:#F1F5FA; border:2px solid var(--line); border-radius:14px;
    padding:10px 18px; font-size:17px; font-family:'Jua'; color:var(--ink);}
  .tool-btn.on{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* 회차 피드백 */
  .feedback{position:relative; text-align:center; padding:18px 10px 6px; border-radius:20px; margin-bottom:16px;}
  .feedback.up{background:#E9F7F2;} .feedback.same{background:#F1F5FA;}
  .feedback.down{background:#FFF3E4;} .feedback.first{background:#F1F5FA;}
  .fb-icon{font-size:56px; line-height:1; animation:pop .5s cubic-bezier(.2,1.6,.4,1);}
  .fb-time{font-family:'Jua'; font-size:44px; margin:4px 0 2px;}
  .fb-headline{font-family:'Jua'; font-size:27px; margin:6px 0 4px;}
  .feedback.up .fb-headline{color:var(--mint);}
  .feedback.down .fb-headline{color:var(--accent-dark);}
  .fb-sub{color:var(--sub); font-size:16px; margin:0 0 8px; line-height:1.6;}
  @keyframes pop{from{transform:scale(.3); opacity:0;} to{transform:scale(1); opacity:1;}}
  .burst{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .burst span{position:absolute; top:34%; left:50%; font-size:26px; opacity:0;
    animation:fly 1.1s ease-out forwards; animation-delay:calc(var(--i)*.08s);}
  .burst span:nth-child(1){--dx:-140px; --dy:-60px;}
  .burst span:nth-child(2){--dx:-70px;  --dy:-100px;}
  .burst span:nth-child(3){--dx:0px;    --dy:-120px;}
  .burst span:nth-child(4){--dx:70px;   --dy:-100px;}
  .burst span:nth-child(5){--dx:140px;  --dy:-60px;}
  @keyframes fly{
    0%{opacity:0; transform:translate(0,0) scale(.4);}
    25%{opacity:1;}
    100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.2);}
  }
  .bar-fill.now{background:var(--ink);}
  @media (prefers-reduced-motion: reduce){
    .fb-icon, .burst span{animation:none;} .burst{display:none;}
  }
</style>
</head>

<script>

/* 7일 × 3차시 학습 자료 */
const DAYS = [
{

  quizB:[

  cloze:[

/* ===================== TTS ===================== */
let ttsUnlocked=false, koVoice=null;
function koVoices(){
  if(!("speechSynthesis" in window)) return [];
  return speechSynthesis.getVoices().filter(v=>v.lang && v.lang.replace("_","-").toLowerCase().startsWith("ko"));
}
function isNice(v){ return /enhanced|premium|natural|고급|향상/i.test(v.name); }
function pickVoice(){
  const vs=koVoices();
  koVoice = vs.find(v=>v.name===state.voiceName) || vs.find(isNice) || vs[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function unlockTTS(){
  if(ttsUnlocked||!("speechSynthesis" in window)) return;
  const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u);
  ttsUnlocked=true; pickVoice();
}
document.addEventListener("pointerdown", unlockTTS, {once:true});
function plain(t){ return t.replace(/\//g," ").replace(/[\u201C\u201D"]/g,"").replace(/___/g,"무엇"); }
function speak(text){
  if(!("speechSynthesis" in window)) return;
  unlockTTS(); speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(plain(text));
  u.lang="ko-KR"; u.rate=state.rate; u.pitch=state.pitch;
  if(!koVoice) pickVoice();
  if(koVoice) u.voice=koVoice;
  speechSynthesis.speak(u);
}
function passageOf(d,set){ return set==="B" ? d.passageB : d.passageA; }
function wordsOf(d,set){ return set==="B" ? d.wordsB : d.wordsA; }
function quizOf(d,set){ return set==="B" ? d.quizB : d.quizA; }

function speakWord(i){
  const d=DAYS[state.day], s=cur().set;
  speak(wordsOf(d,s)[i]); markWordRead(i);
}
function speakSent(i){
  document.querySelectorAll(".sentence").forEach(el=>el.classList.remove("active"));
  const el=document.getElementById("sent"+i); if(el) el.classList.add("active");
  speak(passageOf(DAYS[state.day],cur().set).sentences[i]);
}
function speakDict(){ speak(DAYS[state.day].dictation[state.dictIdx]); }
function speakDictSlow(){ const k=state.rate; state.rate=0.5; speakDict(); state.rate=k; }
function speakCopy(){ speak(DAYS[state.day].copy[state.copyIdx]); }
function speakWriteWord(){ speak(allWords(DAYS[state.day])[state.wordIdx]); }
function speakCloze(){
  const c=DAYS[state.day].cloze[state.clozeIdx];
  speak(c.s.replace("___", c.opts[c.a]));
}
function playAll(){
  if(!("speechSynthesis" in window)) return;
  unlockTTS();
  const list=passageOf(DAYS[state.day],cur().set).sentences;
  speechSynthesis.cancel();
  if(!koVoice) pickVoice();
  list.forEach((s,i)=>{
    const u=new SpeechSynthesisUtterance(plain(s));
    u.lang="ko-KR"; u.rate=state.rate; u.pitch=state.pitch;
    if(koVoice) u.voice=koVoice;
    u.onstart=()=>{ document.querySelectorAll(".sentence").forEach(el=>el.classList.remove("active"));
      const el=document.getElementById("sent"+i); if(el) el.classList.add("active"); };
    speechSynthesis.speak(u);
  });
}

/* ===================== 저장 ===================== */
function lsKey(){ return STORAGE_KEY + ":" + (state.nick||"게스트"); }
function loadLocal(){
  try{ const raw=localStorage.getItem(lsKey()); state.records = raw?JSON.parse(raw):{}; }
  catch(e){ state.records={}; }
}
async function loadRecords(){
  loadLocal(); render();
  if(!db || !state.nick) return;
  state.syncing=true; render();
  try{
    const doc=await db.collection("literacy").doc(state.nick).get();
    if(doc.exists){
      const cloud=doc.data().days || {};
      state.records=Object.assign({}, state.records, cloud);
      localStorage.setItem(lsKey(), JSON.stringify(state.records));
    }
  }catch(e){ console.error("불러오기 실패", e); }
  state.syncing=false; render();
}
async function saveRecord(rec){
  state.records[rec.day]=rec;
  try{ localStorage.setItem(lsKey(), JSON.stringify(state.records)); }catch(e){ console.error(e); }
  if(!db || !state.nick) return;
  try{
    await db.collection("literacy").doc(state.nick).set({
      nick:state.nick, updatedAt:new Date().toISOString(), days:state.records
    },{merge:true});
  }catch(e){ console.error("저장 실패", e); }
}
async function resetRecords(){
  if(!confirm("모든 학습 기록을 정말 지울까요?")) return;
  state.records={}; localStorage.removeItem(lsKey());
  if(db && state.nick){ try{ await db.collection("literacy").doc(state.nick).set({days:{}},{merge:true}); }catch(e){} }
  render();
}
function setNick(name){
  state.nick=name.trim(); localStorage.setItem(NICK_KEY,state.nick);
  state.screen="home"; loadRecords();
}
function logout(){
  state.nick=""; localStorage.removeItem(NICK_KEY);
  state.records={}; state.screen="login"; render();
}

  if(state.screen==="home") renderHome();

  else if(state.screen==="voice") renderVoice();
  else renderDay();
}

function renderRoundFeedback(){
  const s=cur().set, r=state.round[s], t=state.roundTimes[s], now=t[r];
  const last=(r===2);
  let icon, headline, sub, tone, burst="";
  if(r===0){
    icon="⏱"; tone="first";
    headline=`첫 기록은 ${fmtTime(now)}!`;
    sub="이제 이 기록을 깨 볼까요?";
  }else{
    const diff=t[r-1]-now;
    if(diff>0){
      icon="🎉"; tone="up";
      headline=`${diff}초 빨라졌어요!`;
      sub="지난번보다 훨씬 잘 읽었어요. 정말 대단해요!";
      burst='<div class="burst">'+["⭐","✨","🎊","⭐","✨"].map((e,i)=>`<span style="--i:${i}">${e}</span>`).join("")+'</div>';
    }else if(diff===0){
      icon="👍"; tone="same";
      headline="지난번과 똑같아요!";
      sub="안정되게 읽고 있어요. 다음엔 조금만 더 빠르게!";
    }else{
      icon="💪"; tone="down";
      headline=`이번엔 ${-diff}초 느려졌어요`;
      sub="조금 아쉽지만 괜찮아요. 숨을 고르고 한 번 더 도전해요!";
    }
  }
  const bars=t.slice(0,r+1).map((sec,i)=>{
    const max=Math.max(...t.slice(0,r+1));
    const pct=Math.max(14, Math.round(sec/max*100));
    return `<div class="bar-row"><span class="bar-label">${i+1}회</span>
      <div class="bar-track"><div class="bar-fill ${i===r?"now":""}" style="width:${pct}%"></div></div>
      <span class="bar-time">${fmtTime(sec)}</span></div>`;
  }).join("");
  dayShell(`
    <div class="feedback ${tone}">
      ${burst}
      <div class="fb-icon">${icon}</div>
      <div class="fb-time">${fmtTime(now)}</div>
      <h3 class="fb-headline">${headline}</h3>
      <p class="fb-sub">${sub}</p>

    <div class="btn-row" style="justify-content:center;">
      <button class="btn ghost" onclick="retryThisRound()">↺ 이번 회차 다시</button>
      <button class="btn" onclick="continueAfterFeedback()">${last?"결과 보기 →":(r+2)+"회 도전! →"}</button>
    </div>`);
}

/* ---------- 캔버스 원고지 ---------- */
let ctx=null, gctx=null, drawing=false, curGuide="", curReveal="all";
state.tool="pen";
function setTool(t){ state.tool=t; syncToolUI(); }
function syncToolUI(){
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.toggle('on', b.dataset.tool===state.tool));
  const c=document.getElementById('pad'); if(c) c.style.cursor = state.tool==='eraser'?'cell':'crosshair';
}
function toolBar(){
  return `<div class="tool-bar">
    <button class="tool-btn ${state.tool==='pen'?'on':''}" data-tool="pen" onclick="setTool('pen')">✏️ 연필</button>
    <button class="tool-btn ${state.tool==='eraser'?'on':''}" data-tool="eraser" onclick="setTool('eraser')">🧽 지우개</button>
    <button class="tool-btn" onclick="clearPad()">🗑 전부 지우기</button>
  </div>`;
}
function layout(text,w){
  const MIN=62, MAX=104, pad=24;
  const maxPerRow=Math.max(1,Math.floor((w-pad*2)/MIN));
  const words=text.split(" ");
  const lines=[]; let c="";
  words.forEach(wd=>{
    const test=c?c+" "+wd:wd;
    if(test.length>maxPerRow && c){ lines.push(c); c=wd; } else c=test;
  });
  if(c) lines.push(c);
  const longest=Math.max(...lines.map(l=>l.length));
  const cell=Math.min(MAX,(w-pad*2)/longest);
  return {lines, cell, height: Math.round(lines.length*cell + (lines.length-1)*18 + 60)};
}
function drawGuide(text,w,h,reveal){
  reveal=reveal||"all";
  const L=layout(text,w);
  const ctx=gctx;
  ctx.clearRect(0,0,w,h);
  const startX=(w-L.cell*Math.max(...L.lines.map(l=>l.length)))/2;
  let y=(h-(L.lines.length*L.cell+(L.lines.length-1)*18))/2, idx=0;
  L.lines.forEach(line=>{
    let x=startX;
    line.split("").forEach(ch=>{
      ctx.strokeStyle="#D8E2EF"; ctx.lineWidth=2;
      ctx.strokeRect(x,y,L.cell,L.cell);
      if(ch!==" "){
        ctx.setLineDash([6,6]);
        ctx.beginPath(); ctx.moveTo(x,y+L.cell/2); ctx.lineTo(x+L.cell,y+L.cell/2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+L.cell/2,y); ctx.lineTo(x+L.cell/2,y+L.cell); ctx.stroke();
        ctx.setLineDash([]);
        if(reveal==="all" || (reveal==="first" && idx===0)){
          ctx.fillStyle="#DCE5F0"; ctx.font=`${L.cell*0.72}px 'Jua'`;
          ctx.textAlign="center"; ctx.textBaseline="middle";
          ctx.fillText(ch,x+L.cell/2,y+L.cell/2+3);
        }
        idx++;
      }
      x+=L.cell;
    });
    y+=L.cell+18;
  });
}
function drawBlank(w,h,rows){
  const ctx=gctx;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#D8E2EF"; ctx.lineWidth=2; ctx.setLineDash([8,8]);
  for(let r=0;r<rows;r++){
    const y=40+r*((h-60)/rows)+((h-60)/rows)*0.7;
    ctx.beginPath(); ctx.moveTo(24,y); ctx.lineTo(w-24,y); ctx.stroke();
  }
  ctx.setLineDash([]);
}
function setupPad(guideText, blankRows, reveal){
  curGuide=guideText; curReveal=reveal||"all";
  const pad=document.getElementById("pad"), guide=document.getElementById("guide");
  const box=pad.parentElement, w=box.clientWidth;
  const h = guideText ? layout(guideText,w).height : (blankRows||1)*130+40;
  const dpr=window.devicePixelRatio||1;
  [guide,pad].forEach(c=>{ c.width=w*dpr; c.height=h*dpr; c.style.height=h+"px"; });
  box.style.height=h+"px";
  gctx=guide.getContext("2d"); gctx.scale(dpr,dpr);
  ctx=pad.getContext("2d"); ctx.scale(dpr,dpr);
  if(guideText) drawGuide(guideText,w,h,curReveal); else drawBlank(w,h,blankRows||1);
  applyStroke();
  pad.onpointerdown=e=>{ e.preventDefault(); drawing=true; applyStroke(); const p=pt(pad,e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  pad.onpointermove=e=>{ if(!drawing) return; e.preventDefault(); const p=pt(pad,e); ctx.lineTo(p.x,p.y); ctx.stroke(); };
  pad.onpointerup=()=>drawing=false;
  pad.onpointercancel=()=>drawing=false;
  pad.onpointerleave=()=>drawing=false;
  pad.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
  pad.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
  syncToolUI();
}
function applyStroke(){
  if(!ctx) return;
  ctx.lineCap="round"; ctx.lineJoin="round";
  if(state.tool==="eraser"){
    ctx.globalCompositeOperation="destination-out";
    ctx.lineWidth=34;
  }else{
    ctx.globalCompositeOperation="source-over";
    ctx.lineWidth=9; ctx.strokeStyle="#1F3A5F";
  }
}
function clearPad(){
  const pad=document.getElementById("pad");
  if(!pad||!ctx) return;
  const w=pad.parentElement.clientWidth, h=parseInt(pad.style.height);
  const keep=ctx.globalCompositeOperation;
  ctx.globalCompositeOperation="source-over";
  ctx.clearRect(0,0,w,h);
  ctx.globalCompositeOperation=keep;
}
function pt(canvas,e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }

function renderWordWrite(){
  const d=DAYS[state.day], ws=allWords(d), w=ws[state.wordIdx];
  const pills=ws.map((x,i)=>{
    let cls="word-pill";
    if(state.wordsDone.includes(i)) cls+=" done";
    else if(i===state.wordIdx) cls+=" now";
    return `<span class="${cls}">${x}</span>`;
  }).join("");
  dayShell(`
    <h3>낱말 쓰기 <span style="font-size:17px;color:var(--sub)">${state.wordIdx+1}/${ws.length}</span></h3>
    <p class="hint">흐린 글자를 예쁘게 따라 써요. 자신 있으면 <b>가리고 쓰기</b>로 스스로 써 보세요.</p>
    <div class="word-nav">${pills}</div>
    <div class="write-title">${state.wordCover?"❓ ❓ ❓":w}
      <button class="listen-btn" onclick="speakWriteWord()">🔊 듣기</button></div>
    <div class="hint-bar">
      <button class="chip ${!state.wordCover?"on":""}" onclick="setCover(false)">보고 쓰기</button>
      <button class="chip ${state.wordCover?"on":""}" onclick="setCover(true)">가리고 쓰기</button>
    </div>
    ${toolBar()}
    <div class="canvas-box"><canvas id="guide"></canvas><canvas id="pad"></canvas></div>
    <div class="btn-row">
      <button class="btn" onclick="nextWord()">${state.wordIdx<ws.length-1?"다음 낱말 →":"다 썼어요 →"}</button>
    </div>`);
  setupPad(w, null, state.wordCover?"none":"all");
}
function setCover(v){ state.wordCover=v; render(); }
function nextWord(){
  const ws=allWords(DAYS[state.day]);
  if(!state.wordsDone.includes(state.wordIdx)) state.wordsDone.push(state.wordIdx);
  if(state.wordIdx<ws.length-1){ state.wordIdx++; render(); } else nextStep();
}

/* ---------- 받아쓰기 (10문제) ---------- */
const HINT_LABEL=["칸만 보기","첫 글자 힌트","전체 흐린 글자"];
function renderDictation(){
  const d=DAYS[state.day], ans=d.dictation[state.dictIdx];
  const syl=ans.replace(/\s/g,"").replace(/[.,!?]/g,"").length;
  const reveal = state.dictHint===0?"none":(state.dictHint===1?"first":"all");
  dayShell(`
    <h3>받아쓰기 <span style="font-size:17px;color:var(--sub)">${state.dictIdx+1}/${d.dictation.length}</span></h3>
    <p class="hint">🔊 를 눌러 잘 듣고, 칸에 또박또박 쓰세요. 어려우면 <b>도움 단계</b>를 올려도 괜찮아요.</p>
    <div class="dict-bar">
      <button class="btn sm" onclick="speakDict()">🔊 문제 듣기</button>
      <button class="btn sm ghost" onclick="speakDictSlow()">🐢 천천히 듣기</button>
      <span class="syl-count">${syl}글자</span>
    </div>
    <div class="hint-bar">
      <span class="hint-label">도움 단계</span>
      ${[0,1,2].map(h=>`<button class="chip ${state.dictHint===h?"on":""}" onclick="setHint(${h})">${HINT_LABEL[h]}</button>`).join("")}
    </div>
    ${toolBar()}
    <div class="canvas-box"><canvas id="guide"></canvas><canvas id="pad"></canvas></div>
    <div class="answer-box">${state.dictShown?ans:""}</div>
    <div class="btn-row">
      <button class="btn ghost" onclick="showDictAnswer()">👀 정답 확인</button>
      <button class="btn" onclick="nextDict()">${state.dictIdx<d.dictation.length-1?"다음 문제 →":"받아쓰기 끝 →"}</button>
    </div>
    ${state.dictShown?'<p class="hint" style="text-align:center;margin-top:12px;">정답을 보고 한 번 더 써 보면 훨씬 잘 외워져요.</p>':""}`);
  setupPad(ans, null, reveal);
}
function setHint(h){ state.dictHint=h; render(); }
function showDictAnswer(){ state.dictShown=true; state.dictHint=2; render(); }
function nextDict(){
  const d=DAYS[state.day];
  state.dictShown=false; state.dictHint=0;
  if(state.dictIdx<d.dictation.length-1){ state.dictIdx++; render(); } else nextStep();
}

/* ---------- 빈칸 채우기 ---------- */
function renderCloze(){
  const d=DAYS[state.day], c=d.cloze[state.clozeIdx];
  const opts=c.opts.map((o,i)=>`<button class="opt" id="copt${i}" onclick="answerCloze(${i})">${o}</button>`).join("");
  dayShell(`
    <h3>빈칸 채우기</h3>
    <p class="hint">문장을 읽고 빈칸에 알맞은 낱말을 골라 보세요.</p>
    <div class="quiz-progress">${state.clozeIdx+1} / ${d.cloze.length} 문제 · 맞힌 개수 ${state.clozeScore}개</div>
    <p class="cloze-sentence">${c.s.replace("___",'<span class="blank">＿＿</span>')}</p>
    <div class="quiz-opts">${opts}</div>
    <div class="quiz-feedback" id="cfb"></div>
    <div class="btn-row" id="cnext"></div>`);
}
function answerCloze(i){
  if(state.clozeAnswered) return;
  state.clozeAnswered=true;
  const d=DAYS[state.day], c=d.cloze[state.clozeIdx];
  document.getElementById("copt"+c.a).classList.add("correct");
  const fb=document.getElementById("cfb");
  if(i===c.a){ state.clozeScore++; fb.textContent="⭕ 맞았어요!"; fb.style.color="var(--mint)"; }
  else{ document.getElementById("copt"+i).classList.add("wrong"); fb.textContent="❌ 초록색이 정답이에요."; fb.style.color="var(--wrong)"; }
  speakCloze();
  const last=state.clozeIdx===d.cloze.length-1;
  document.getElementById("cnext").innerHTML=
    `<button class="btn ghost" onclick="speakCloze()">🔊 문장 듣기</button>
     <button class="btn" onclick="nextCloze()">${last?"빈칸 끝! →":"다음 문제 →"}</button>`;
}
function nextCloze(){
  const d=DAYS[state.day];
  state.clozeAnswered=false;
  if(state.clozeIdx<d.cloze.length-1){ state.clozeIdx++; render(); } else nextStep();
}

/* ---------- 문장 따라 쓰기 (3문장) ---------- */
function renderCopyWrite(){
  const d=DAYS[state.day], s=d.copy[state.copyIdx];
  dayShell(`
    <h3>문장 따라 쓰기 <span style="font-size:17px;color:var(--sub)">${state.copyIdx+1}/${d.copy.length}</span></h3>
    <p class="hint">소리 내어 읽으면서 또박또박 써요. 띄어쓰기 칸은 비워 두세요.</p>
    <div class="write-title">${s}<button class="listen-btn" onclick="speakCopy()">🔊 듣기</button></div>
    ${toolBar()}
    <div class="canvas-box"><canvas id="guide"></canvas><canvas id="pad"></canvas></div>
    <div class="btn-row">
      <button class="btn" onclick="nextCopy()">${state.copyIdx<d.copy.length-1?"다음 문장 →":"다 썼어요 →"}</button>
    </div>`);
  setupPad(s);
}
function nextCopy(){
  const d=DAYS[state.day];
  if(state.copyIdx<d.copy.length-1){ state.copyIdx++; render(); } else nextStep();
}

/* ---------- 내 문장 쓰기 (2개) ---------- */
function renderFreeWrite(){
  const d=DAYS[state.day], last=state.freeIdx===d.free.length-1;
  dayShell(`
    <h3>내 문장 쓰기 <span style="font-size:17px;color:var(--sub)">${state.freeIdx+1}/${d.free.length}</span></h3>
    <p class="hint">${d.free[state.freeIdx]}</p>
    ${toolBar()}
    <div class="canvas-box"><canvas id="guide"></canvas><canvas id="pad"></canvas></div>
    <div class="btn-row">
      <button class="btn ${last?"mint":""}" onclick="nextFree()">${last?"다 했어요! →":"다음 →"}</button>
    </div>`);
  setupPad("", 3);
}
function nextFree(){
  const d=DAYS[state.day];
  if(state.freeIdx<d.free.length-1){ state.freeIdx++; render(); } else completeDay();
}

/* ---------- 완료 ---------- */
function completeDay(){
  const d=DAYS[state.day];
  const rec={ day:state.day, date:new Date().toISOString().slice(0,10),
    readA:state.roundTimes.A, readB:state.roundTimes.B,
    quizScore:state.quizScore.A+state.quizScore.B,
    quizTotal:d.quizA.length+d.quizB.length,
    clozeScore:state.clozeScore, clozeTotal:d.cloze.length };
  saveRecord(rec);
  state.step=FINISH_STEP; render();
}
function renderFinish(){
  const d=DAYS[state.day], a=state.roundTimes.A, b=state.roundTimes.B;
  app.innerHTML=`
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">← 처음으로</button>
      <h2>${state.day+1}일째 · ${d.title}</h2>
    </div>
    <div class="panel"><div class="finish">
      <div class="big-stamp">참<br>잘했어요</div>
      <div class="stars">★ ★ ★</div>
      <h3 style="font-size:28px;">3차시를 모두 해냈어요!</h3>
      <div class="result-list">
        📖 글① 1회 ${a[0]!=null?fmtTime(a[0]):"-"} → 3회 ${a[2]!=null?fmtTime(a[2]):"-"}<br>
        📖 글② 1회 ${b[0]!=null?fmtTime(b[0]):"-"} → 3회 ${b[2]!=null?fmtTime(b[2]):"-"}<br>
        ✅ 내용 퀴즈 ${state.quizScore.A+state.quizScore.B} / ${d.quizA.length+d.quizB.length}<br>
        📝 빈칸 채우기 ${state.clozeScore} / ${d.cloze.length}
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn" onclick="goHome()">처음으로 가기</button>
      </div>
    </div></div>`;
}

/* ---------- 목소리 고르기 ---------- */
function renderVoice(){
  const vs=koVoices();
  const list = vs.length ? vs.map(v=>{
    const on=(koVoice && v.name===koVoice.name);
    return `<button class="voice-row ${on?"on":""}" onclick="chooseVoice('${v.name.replace(/'/g,"\\'")}')">
      <span class="vname">${v.name}${isNice(v)?' <span class="tag">고급</span>':''}</span>
      <span class="vpick">${on?"✔ 사용 중":"들어보기"}</span></button>`;
  }).join("") : '<p class="hint">이 기기에 한국어 음성이 없어요. 아래 안내대로 먼저 내려받아 주세요.</p>';
  app.innerHTML=`
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">← 처음으로</button>
      <h2>🔊 목소리 고르기</h2>
    </div>
    <div class="panel">
      <h3>어떤 목소리로 읽어 줄까요?</h3>
      <p class="hint">이름을 누르면 미리 들어볼 수 있어요. <b>고급</b>이 붙은 목소리가 가장 자연스러워요.</p>
      ${list}
      <h3 style="margin-top:26px;">목소리 높낮이</h3>
      <div class="slider-row">
        <span>낮게</span>
        <input type="range" id="pitch" min="0.7" max="1.6" step="0.05" value="${state.pitch}" oninput="setPitch(this.value)">
        <span>높게</span>
      </div>
      <div class="btn-row"><button class="btn ghost" onclick="testVoice()">🔊 시험 삼아 듣기</button></div>
      <div class="notice" style="margin-top:22px;">
        <b>아이패드에서 더 좋은 목소리 받기</b><br>
        설정 → 손쉬운 사용 → 콘텐츠 말하기 → 음성 → 한국어 에서 <b>유나(고급)</b>를 내려받으면 훨씬 자연스러워져요.
      </div>
    </div>`;
}
function chooseVoice(name){
  state.voiceName=name; localStorage.setItem(VOICE_KEY,name);
  pickVoice(); speak("안녕하세요. 오늘도 함께 공부해요."); render();
}
function setPitch(v){ state.pitch=parseFloat(v); localStorage.setItem(PITCH_KEY,v); }
function testVoice(){ speak("나는 놀이터에서 그네를 탔어요."); }

/* ---------- 선생님 기록 ---------- */
function renderTeacher(){
  const rows=Object.values(state.records).sort((a,b)=>a.day-b.day).map(r=>{
    const a=r.readA||[], b=r.readB||[];
    return `<tr><td>${r.day+1}일</td><td>${DAYS[r.day].title}</td><td>${r.date}</td>
      <td>${a[0]!=null?fmtTime(a[0]):"-"} → ${a[2]!=null?fmtTime(a[2]):"-"}</td>
      <td>${b[0]!=null?fmtTime(b[0]):"-"} → ${b[2]!=null?fmtTime(b[2]):"-"}</td>
      <td>${r.quizScore}/${r.quizTotal||10}</td>
      <td>${r.clozeScore!=null?r.clozeScore+"/"+(r.clozeTotal||5):"-"}</td></tr>`;
  }).join("");
  app.innerHTML=`
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">← 처음으로</button>
      <h2>📋 ${state.nick} 학습 기록</h2>
    </div>
    <div class="notice">${cloudOK
      ? `☁️ 클라우드 저장 중 — Firestore <b>literacy / ${state.nick}</b> 문서`
      : "💾 이 기기에만 저장돼요."}</div>
    <div class="panel">
      ${rows?`<table>
        <tr><th>일차</th><th>제목</th><th>날짜</th><th>글① 1회→3회</th><th>글② 1회→3회</th><th>퀴즈</th><th>빈칸</th></tr>
        ${rows}</table>`:'<p class="hint">아직 기록이 없어요. 학습을 마치면 자동으로 기록됩니다.</p>'}
      <p class="hint" style="margin-top:14px;">💡 같은 글을 3번 읽는 <b>반복 읽기</b>가 유창성 지도의 핵심이에요. 1회→3회 단축 폭이 날마다 어떻게 달라지는지 비교해 보세요.</p>
      ${rows?'<button class="btn ghost sm" style="margin-top:10px;" onclick="resetRecords()">🗑 기록 초기화</button>':""}
    </div>`;
}

render(); loadRecords();

</script>
</body>
</html>
