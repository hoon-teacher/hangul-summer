<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>여름방학 한글 교실</title>
<!-- 아이패드: 홈 화면에 추가하면 앱처럼 전체화면으로 열립니다 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한글 교실">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23FF8A3D'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle' fill='white' font-family='sans-serif'%3E%EA%B0%80%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF4FB; --card:#FFFFFF; --ink:#1F3A5F; --sub:#6B7C93;
    --accent:#FF8A3D; --accent-dark:#E9731F; --mint:#2FB894; --line:#D8E2EF;
    --guide:#DCE5F0; --star:#FFC53D; --wrong:#E45B5B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Gowun Dodum',sans-serif; min-height:100vh;}
  h1,h2,h3,.jua{font-family:'Jua',sans-serif; font-weight:400;}
  button{font-family:inherit; border:none; cursor:pointer;}
  .wrap{max-width:900px; margin:0 auto; padding:20px 16px 60px;}

  /* 홈 */
  .home-head{text-align:center; margin:12px 0 22px;}
  .home-head h1{font-size:34px; margin:0;}
  .home-head p{color:var(--sub); margin:6px 0 0; font-size:16px;}
  .day-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .day-card{background:var(--card); border:2px solid var(--line); border-radius:20px; padding:18px 16px; text-align:left; position:relative; transition:transform .1s;}
  .day-card:active{transform:scale(.97);}
  .day-card .dnum{display:inline-block; background:var(--ink); color:#fff; border-radius:10px; padding:3px 10px; font-size:14px; font-family:'Jua';}
  .day-card h3{margin:10px 0 4px; font-size:21px;}
  .day-card p{margin:0; color:var(--sub); font-size:14px;}
  .day-card .meta{margin-top:8px; font-size:13px; color:var(--sub);}
  .stamp{position:absolute; top:10px; right:10px; width:58px; height:58px; border-radius:50%;
    border:3px solid var(--wrong); color:var(--wrong); display:flex; align-items:center; justify-content:center;
    font-family:'Jua'; font-size:13px; transform:rotate(-14deg); background:rgba(255,255,255,.7);
    line-height:1.1; text-align:center;}
  .teacher-link{display:block; margin:26px auto 0; background:none; color:var(--sub); font-size:14px; text-decoration:underline;}

  /* 공통 */
  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .back-btn{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:8px 14px; font-size:16px; color:var(--ink);}
  .topbar h2{margin:0; font-size:22px; flex:1;}
  .steps{display:flex; gap:5px; margin-bottom:6px;}
  .step-dot{flex:1; height:14px; border-radius:8px; background:var(--line); border:none; padding:0; cursor:pointer;}
  .step-dot.on{background:#FFC79A;}
  .step-dot.now{background:var(--accent); box-shadow:0 0 0 3px rgba(255,138,61,.25);}
  .step-caption{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; flex-wrap:wrap; gap:6px;}
  .step-name{font-family:'Jua'; font-size:17px; color:var(--ink);}
  .step-tip{font-size:13px; color:var(--sub);}

  /* 받아쓰기 도움 */
  .dict-bar{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  .syl-count{background:#F1F5FA; border:2px solid var(--line); border-radius:999px; padding:7px 15px; font-family:'Jua'; font-size:16px;}
  .hint-bar{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .hint-label{font-size:14px; color:var(--sub); margin-right:2px;}
  .panel{background:var(--card); border:2px solid var(--line); border-radius:22px; padding:22px 20px;}
  .panel h3{margin:0 0 4px; font-size:24px;}
  .panel .hint{color:var(--sub); font-size:15px; margin:0 0 16px; line-height:1.6;}
  .btn{background:var(--accent); color:#fff; border-radius:16px; padding:14px 26px; font-size:20px; font-family:'Jua'; box-shadow:0 3px 0 var(--accent-dark);}
  .btn:active{transform:translateY(2px); box-shadow:none;}
  .btn.ghost{background:#F1F5FA; color:var(--ink); box-shadow:0 3px 0 var(--line);}
  .btn.mint{background:var(--mint); box-shadow:0 3px 0 #219478;}
  .btn.sm{font-size:16px; padding:10px 18px;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; align-items:center;}
  .chip{border-radius:999px; padding:8px 16px; font-size:15px; background:#F1F5FA; border:2px solid var(--line); color:var(--ink);}
  .chip.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .toggle-row{display:flex; gap:8px; align-items:center; margin:8px 0 16px; flex-wrap:wrap;}

  /* 낱말 카드 */
  .word-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .wcard{background:#F8FAFD; border:2px solid var(--line); border-radius:18px; padding:22px 10px; font-family:'Jua'; font-size:26px; color:var(--ink);}
  .wcard.read{background:#E9F7F2; border-color:var(--mint);}
  .wcard:active{transform:scale(.96);}

  /* 읽기 */
  .sentence{font-size:26px; line-height:1.95; padding:8px 12px; border-radius:14px;}
  .sentence.active{background:#FFF3E4;}
  .sentence .num{color:var(--sub); font-size:16px; margin-right:8px;}
  .sentence .slash{color:var(--accent); font-weight:bold; margin:0 3px;}
  .listen-btn{background:#F1F5FA; border:2px solid var(--line); border-radius:12px; padding:4px 12px; font-size:16px; margin-left:8px; vertical-align:middle; color:var(--ink);}

  /* 타이머 */
  .timer{font-family:'Jua'; font-size:54px; text-align:center; margin:8px 0;}
  .round-row{display:flex; justify-content:center; gap:10px; margin-bottom:10px;}
  .round-pill{padding:8px 16px; border-radius:999px; background:#F1F5FA; border:2px solid var(--line); font-size:15px; font-family:'Jua';}
  .round-pill.now{border-color:var(--accent); background:#FFF3E4;}
  .round-pill.done{background:var(--mint); color:#fff; border-color:var(--mint);}
  .counter{display:flex; align-items:center; justify-content:center; gap:16px; margin:12px 0 2px;}
  .counter button{width:56px; height:56px; border-radius:50%; font-size:28px; background:#F1F5FA; border:2px solid var(--line); color:var(--ink);}
  .counter .cnum{font-family:'Jua'; font-size:34px; min-width:60px; text-align:center;}
  .counter-label{text-align:center; color:var(--sub); font-size:15px;}

  /* 퀴즈 */
  .quiz-q{font-family:'Jua'; font-size:23px; margin:0 0 12px;}
  .quiz-opts{display:grid; gap:10px;}
  .opt{text-align:left; background:#F8FAFD; border:2px solid var(--line); border-radius:16px; padding:16px 18px; font-size:20px; color:var(--ink);}
  .opt.correct{background:#E9F7F2; border-color:var(--mint);}
  .opt.wrong{background:#FDECEC; border-color:var(--wrong);}
  .quiz-feedback{font-family:'Jua'; font-size:22px; margin-top:14px; min-height:30px;}
  .quiz-progress{color:var(--sub); font-size:15px; margin-bottom:6px;}

  /* 쓰기 */
  .write-title{text-align:center; font-family:'Jua'; font-size:25px; margin-bottom:10px; line-height:1.5;}
  .canvas-box{border:2px dashed var(--line); border-radius:16px; overflow:hidden; background:#fff; touch-action:none;}
  canvas{display:block; width:100%;}
  .word-nav{display:flex; justify-content:center; gap:8px; margin:0 0 12px; flex-wrap:wrap;}
  .word-pill{padding:6px 13px; border-radius:999px; background:#F1F5FA; border:2px solid var(--line); font-size:16px; color:var(--ink);}
  .word-pill.done{background:var(--mint); color:#fff; border-color:var(--mint);}
  .word-pill.now{border-color:var(--accent); background:#FFF3E4;}
  .answer-box{margin-top:12px; text-align:center; font-family:'Jua'; font-size:26px; color:var(--mint); min-height:34px;}

  /* 완료 */
  .finish{text-align:center; padding:26px 0;}
  .big-stamp{width:150px; height:150px; margin:0 auto 16px; border-radius:50%; border:6px solid var(--wrong);
    color:var(--wrong); display:flex; align-items:center; justify-content:center; font-family:'Jua'; font-size:26px;
    transform:rotate(-12deg); animation:stampIn .5s cubic-bezier(.2,1.6,.4,1);}
  @keyframes stampIn{from{transform:scale(2.4) rotate(-12deg); opacity:0;} to{transform:scale(1) rotate(-12deg); opacity:1;}}
  .stars{font-size:40px; letter-spacing:6px; margin:6px 0 14px; color:var(--star);}
  .result-list{display:inline-block; text-align:left; font-size:17px; line-height:2; color:var(--sub);}

  /* 교사 기록 */
  table{width:100%; border-collapse:collapse; font-size:15px;}
  th,td{padding:10px 6px; border-bottom:1px solid var(--line); text-align:center;}
  th{color:var(--sub); font-weight:normal;}
  .notice{background:#FFF7E8; border:2px solid #F5DFAE; color:#8A6D1E; border-radius:14px; padding:12px 14px; font-size:14px; margin-bottom:14px; line-height:1.7;}

  /* 목소리 설정 */
  .voice-row{display:flex; justify-content:space-between; align-items:center; width:100%;
    background:#F8FAFD; border:2px solid var(--line); border-radius:16px; padding:15px 18px; margin-bottom:10px; color:var(--ink);}
  .voice-row.on{background:#E9F7F2; border-color:var(--mint);}
  .vname{font-family:'Jua'; font-size:19px;}
  .vpick{font-size:15px; color:var(--sub);}
  .voice-row.on .vpick{color:var(--mint);}
  .tag{background:var(--mint); color:#fff; border-radius:8px; padding:2px 8px; font-size:13px; margin-left:6px;}
  .slider-row{display:flex; align-items:center; gap:12px; font-size:15px; color:var(--sub);}
  .slider-row input{flex:1; height:34px;}

  /* 로그인 */
  .nick-input{width:100%; font-family:'Jua'; font-size:26px; text-align:center; padding:14px;
    border:2px solid var(--line); border-radius:16px; color:var(--ink); background:#F8FAFD;
    -webkit-user-select:text; user-select:text;}
  .nick-input:focus{outline:none; border-color:var(--accent); background:#fff;}
  .mini-link{background:none; color:var(--sub); font-size:13px; text-decoration:underline; margin-left:8px;}
  .stamp-row{font-size:26px; letter-spacing:4px; margin-top:8px;}

  /* 읽기 조작 바 */
  .control-bar{background:#F8FAFD; border:2px solid var(--line); border-radius:18px;
    padding:14px 16px 10px; margin-bottom:18px; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .control-bar .timer{margin:0; font-size:48px;}
  .control-bar .counter{margin:6px 0 0;}
  .control-bar .counter button{width:48px; height:48px; font-size:24px;}

  /* 읽기 결과 그래프 */
  .bars{margin:10px 0 18px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .bar-label{font-family:'Jua'; font-size:18px; width:44px;}
  .bar-track{flex:1; background:#F1F5FA; border-radius:10px; height:32px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:10px; transition:width .6s;}
  .bar-fill.best{background:var(--mint);}
  .bar-time{font-family:'Jua'; font-size:18px; width:60px; text-align:right;}
  .result-msg{text-align:center; font-family:'Jua'; font-size:22px; color:var(--ink); margin:6px 0 4px; line-height:1.6;}
</style>
</head>

/* ===================== TTS ===================== */
/* iOS(아이패드)는 첫 화면 터치가 있어야 소리가 납니다. */
let ttsUnlocked=false, koVoice=null;
function koVoices(){
  if(!("speechSynthesis" in window)) return [];
  return speechSynthesis.getVoices().filter(v=>v.lang && v.lang.replace("_","-").toLowerCase().startsWith("ko"));
}
function isNice(v){ return /enhanced|premium|natural|고급|향상/i.test(v.name); }
function pickVoice(){
  const vs=koVoices();
  koVoice = vs.find(v=>v.name===state.voiceName) || vs.find(isNice) || vs[0] || null;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function unlockTTS(){
  if(ttsUnlocked||!("speechSynthesis" in window)) return;
  const u=new SpeechSynthesisUtterance(" ");
  u.volume=0; speechSynthesis.speak(u);
  ttsUnlocked=true; pickVoice();
}
document.addEventListener("pointerdown", unlockTTS, {once:true});

function plain(t){ return t.replace(/\//g," ").replace(/[\u201C\u201D"]/g,""); }
function speak(text){
  if(!("speechSynthesis" in window)) return;
  unlockTTS();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(plain(text));
  u.lang="ko-KR"; u.rate=state.rate; u.pitch=state.pitch;
  if(!koVoice) pickVoice();
  if(koVoice) u.voice=koVoice;
  speechSynthesis.speak(u);
}
function speakWord(i){ speak(DAYS[state.day].words[i]); markWordRead(i); }
function speakSent(i){
  document.querySelectorAll(".sentence").forEach(el=>el.classList.remove("active"));
  const el=document.getElementById("sent"+i); if(el) el.classList.add("active");
  speak(DAYS[state.day].passage[i]);
}
function speakDict(){ speak(DAYS[state.day].dictation[state.dictIdx]); }
function speakCopy(){ speak(DAYS[state.day].copy); }
function playAll(){
  if(!("speechSynthesis" in window)) return;
  unlockTTS();
  const list=DAYS[state.day].passage;
  speechSynthesis.cancel();
  if(!koVoice) pickVoice();
  list.forEach((s,i)=>{
    const u=new SpeechSynthesisUtterance(plain(s));
    u.lang="ko-KR"; u.rate=state.rate; u.pitch=state.pitch;
    if(koVoice) u.voice=koVoice;
    u.onstart=()=>{ document.querySelectorAll(".sentence").forEach(el=>el.classList.remove("active"));
      const el=document.getElementById("sent"+i); if(el) el.classList.add("active"); };
    speechSynthesis.speak(u);
  });
}

/* ===================== 저장 (닉네임별) ===================== */
function lsKey(){ return STORAGE_KEY + ":" + (state.nick||"게스트"); }

function loadLocal(){
  try{ const raw=localStorage.getItem(lsKey()); state.records = raw?JSON.parse(raw):{}; }
  catch(e){ state.records={}; }
}
async function loadRecords(){
  loadLocal();
  render();
  if(!db || !state.nick) return;
  state.syncing=true; render();
  try{
    const doc=await db.collection("literacy").doc(state.nick).get();
    if(doc.exists){
      const cloud=doc.data().days || {};
      // 클라우드 기록을 기준으로 병합 (로컬에만 있는 날짜는 유지)
      state.records = Object.assign({}, state.records, cloud);
      localStorage.setItem(lsKey(), JSON.stringify(state.records));
    }
  }catch(e){ console.error("불러오기 실패", e); }
  state.syncing=false; render();
}
async function saveRecord(rec){
  state.records[rec.day]=rec;
  try{ localStorage.setItem(lsKey(), JSON.stringify(state.records)); }catch(e){ console.error(e); }
  if(!db || !state.nick) return;
  try{
    await db.collection("literacy").doc(state.nick).set({
      nick: state.nick,
      updatedAt: new Date().toISOString(),
      days: state.records
    }, {merge:true});
  }catch(e){ console.error("저장 실패", e); }
}
async function resetRecords(){
  if(!confirm("모든 학습 기록을 정말 지울까요?")) return;
  state.records={}; localStorage.removeItem(lsKey());
  if(db && state.nick){
    try{ await db.collection("literacy").doc(state.nick).set({days:{}}, {merge:true}); }catch(e){ console.error(e); }
  }
  render();
}
function setNick(name){
  state.nick=name.trim();
  localStorage.setItem(NICK_KEY, state.nick);
  state.screen="home";
  loadRecords();
}
function logout(){
  state.nick=""; localStorage.removeItem(NICK_KEY);
  state.records={}; state.screen="login"; render();
}

  if(state.screen==="home") renderHome();
  else if(state.screen==="teacher") renderTeacher();
  else if(state.screen==="voice") renderVoice();
  else renderDay();
}

function openVoice(){ state.screen="voice"; render(); }
function openDay(i){
  state.screen="day"; state.day=i; state.step=0;
  state.wordsRead=[]; state.timerSec=0; state.stumbles=0; state.running=false;
  state.round=0; state.roundTimes=[]; state.readDone=false;
  state.quizIdx=0; state.quizScore=0; state.quizAnswered=false;
  state.wordIdx=0; state.wordsDone=[]; state.wordCover=false;
  state.dictIdx=0; state.dictShown=false; state.dictHint=0;
  clearInterval(state.timerId);
  render();
}
function openTeacher(){ state.screen="teacher"; render(); }
function goHome(){ clearInterval(state.timerId); state.screen="home"; render(); }
function dayShell(inner){
  const d=DAYS[state.day];
  const dots=STEP_NAMES.map((name,s)=>
    `<button class="step-dot ${s===state.step?"now":(s<state.step?"on":"")}" title="${name}" onclick="goStep(${s})"></button>`).join("");
  const prev = state.step>0
    ? `<button class="back-btn" onclick="goStep(${state.step-1})">◀ 이전 단계</button>` : "";
  const cur = STEP_NAMES[state.step] ? `<span class="step-name">${state.step+1}. ${STEP_NAMES[state.step]}</span>` : "";
  app.innerHTML=`
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">← 처음으로</button>
      <h2>${state.day+1}일째 · ${d.title}</h2>
      ${prev}
    </div>
    <div class="steps">${dots}</div>
    <div class="step-caption">${cur}<span class="step-tip">동그라미를 눌러 원하는 단계로 이동할 수 있어요</span></div>
    <div class="panel">${inner}</div>`;
}
function goStep(s){
  if(s<0 || s>=STEP_NAMES.length) return;
  clearInterval(state.timerId); state.running=false;
  state.step=s;
  if(s===3) state.quizAnswered=false;   // 퀴즈는 현재 문제부터 다시
  render();
}
function nextStep(){ state.step++; render(); }
function setRate(r){ state.rate=r; render(); }
function toggleSlash(){ state.showSlash=!state.showSlash; render(); }
function fmtTime(s){ return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }

function renderDay(){
  const fns=[renderWordCards,renderListen,renderReadAloud,renderQuiz,renderWordWrite,renderDictation,renderCopyWrite,renderFreeWrite,renderFinish];
  fns[state.step]();
}

/* ---------- ① 낱말 익히기 ---------- */
function markWordRead(i){
  if(!state.wordsRead.includes(i)){ state.wordsRead.push(i);
    const el=document.getElementById("wc"+i); if(el) el.classList.add("read"); }
}
function renderWordCards(){
  const d=DAYS[state.day];
  const cards=d.words.map((w,i)=>
    `<button class="wcard ${state.wordsRead.includes(i)?"read":""}" id="wc${i}" onclick="speakWord(${i})">${w}</button>`).join("");
  dayShell(`
    <h3>① 오늘의 낱말 익히기</h3>
    <p class="hint">낱말을 누르면 소리가 나요. 듣고 따라 읽어 보세요. (${state.wordsRead.length}/${d.words.length})</p>
    <div class="toggle-row">
      <button class="chip ${state.rate===0.6?"on":""}" onclick="setRate(0.6)">🐢 아주 천천히</button>
      <button class="chip ${state.rate===0.75?"on":""}" onclick="setRate(0.75)">🚶 천천히</button>
      <button class="chip ${state.rate===1?"on":""}" onclick="setRate(1)">🏃 보통</button>
    </div>
    <div class="word-grid">${cards}</div>
    <div class="btn-row"><button class="btn" onclick="nextStep()">다음으로 →</button></div>`);
}

/* ---------- ② 듣고 따라 읽기 ---------- */
function renderListen(){
  const d=DAYS[state.day];
  const sents=d.passage.map((s,i)=>{
    const html=state.showSlash ? s.replace(/\//g,'<span class="slash">∨</span>') : s.replace(/\s*\/\s*/g," ");
    return `<div class="sentence" id="sent${i}"><span class="num">${i+1}</span>${html}
      <button class="listen-btn" onclick="speakSent(${i})">🔊</button></div>`;
  }).join("");
  dayShell(`
    <h3>② 듣고 따라 읽기</h3>
    <p class="hint">🔊 를 누르고 선생님과 함께 한 문장씩 따라 읽어요. ∨ 표시에서 살짝 쉬어요.</p>

      <button class="btn" onclick="nextStep()">다음으로 →</button>

function renderReadResult(){
  const t=state.roundTimes;
  const max=Math.max(...t);
  const bars=t.map((sec,i)=>{
    const pct=Math.max(12, Math.round(sec/max*100));
    const best = sec===Math.min(...t);
    return `<div class="bar-row">
      <span class="bar-label">${i+1}회</span>

      <span class="bar-time">${fmtTime(sec)}</span>

  }).join("");
  const diff=t[0]-t[2];
  const msg = diff>0
    ? `1회보다 <b>${diff}초</b>나 빨라졌어요! 정말 대단해요 🎉`
    : (diff===0 ? "1회와 같은 속도로 안정되게 읽었어요 👍"

function toggleTimer(){
  if(state.running){ clearInterval(state.timerId); state.running=false; }

    state.running=true;

/* ---------- 캔버스 원고지 ---------- */
let ctx=null, drawing=false, curGuide="", curReveal="all";
function layout(text,w){
  const MIN=62, MAX=104, pad=24;
  const maxPerRow=Math.max(1,Math.floor((w-pad*2)/MIN));
  const words=text.split(" ");
  const lines=[]; let cur="";
  words.forEach(wd=>{
    const test = cur ? cur+" "+wd : wd;
    if(test.length>maxPerRow && cur){ lines.push(cur); cur=wd; }
    else cur=test;
  });
  if(cur) lines.push(cur);
  const longest=Math.max(...lines.map(l=>l.length));
  const cell=Math.min(MAX,(w-pad*2)/longest);
  return {lines, cell, height: Math.round(lines.length*cell + (lines.length-1)*18 + 60)};
}
function drawGuide(text,w,h,reveal){
  reveal = reveal || "all";   // all | first | none
  const L=layout(text,w);
  ctx.clearRect(0,0,w,h);
  const startX=(w-L.cell*Math.max(...L.lines.map(l=>l.length)))/2;
  let y=(h-(L.lines.length*L.cell+(L.lines.length-1)*18))/2;
  let idx=0;
  L.lines.forEach(line=>{
    let x=startX;
    line.split("").forEach(ch=>{
      ctx.strokeStyle="#D8E2EF"; ctx.lineWidth=2;
      ctx.strokeRect(x,y,L.cell,L.cell);          // 띄어쓰기도 한 칸을 차지 (원고지 방식)
      if(ch!==" "){
        ctx.setLineDash([6,6]);
        ctx.beginPath(); ctx.moveTo(x,y+L.cell/2); ctx.lineTo(x+L.cell,y+L.cell/2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+L.cell/2,y); ctx.lineTo(x+L.cell/2,y+L.cell); ctx.stroke();
        ctx.setLineDash([]);
        const show = reveal==="all" || (reveal==="first" && idx===0);
        if(show){
          ctx.fillStyle="#DCE5F0";
          ctx.font=`${L.cell*0.72}px 'Jua'`;
          ctx.textAlign="center"; ctx.textBaseline="middle";
          ctx.fillText(ch,x+L.cell/2,y+L.cell/2+3);
        }
        idx++;
      }
      x+=L.cell;
    });
    y+=L.cell+18;
  });
  ctx.lineWidth=9; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#1F3A5F";
}
function setupPad(guideText, blankRows, reveal){
  curGuide=guideText; curReveal=reveal||"all";
  const canvas=document.getElementById("pad");
  const w=canvas.parentElement.clientWidth;
  const h = guideText ? layout(guideText,w).height : (blankRows||1)*130+40;
  const dpr=window.devicePixelRatio||1;
  canvas.width=w*dpr; canvas.height=h*dpr;
  canvas.style.height=h+"px";
  ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  if(guideText) drawGuide(guideText,w,h,curReveal); else drawBlank(w,h,blankRows||1);
  canvas.onpointerdown=e=>{ e.preventDefault(); drawing=true; const p=pt(canvas,e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  canvas.onpointermove=e=>{ if(!drawing) return; e.preventDefault(); const p=pt(canvas,e); ctx.lineTo(p.x,p.y); ctx.stroke(); };
  canvas.onpointerup=()=>drawing=false;
  canvas.onpointercancel=()=>drawing=false;
  canvas.onpointerleave=()=>drawing=false;
  canvas.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
  canvas.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
}
function drawBlank(w,h,rows){
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#D8E2EF"; ctx.lineWidth=2; ctx.setLineDash([8,8]);
  for(let r=0;r<rows;r++){
    const y=40+r*((h-60)/rows)+((h-60)/rows)*0.7;
    ctx.beginPath(); ctx.moveTo(24,y); ctx.lineTo(w-24,y); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.lineWidth=9; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#1F3A5F";
}
function clearPad(){
  const canvas=document.getElementById("pad");
  const w=canvas.parentElement.clientWidth, h=parseInt(canvas.style.height);
  if(curGuide) drawGuide(curGuide,w,h,curReveal); else drawBlank(w,h,3);
}
function pt(canvas,e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }

      : "💾 지금은 이 태블릿에만 저장돼요. 코드 위쪽 firebaseConfig를 채우면 클라우드 저장이 켜집니다."}</div>
    <div class="panel">
      ${rows?`<table>
        <tr><th>일차</th><th>제목</th><th>날짜</th><th>1회</th><th>2회</th><th>3회</th><th>더듬음</th><th>퀴즈</th></tr>
        ${rows}</table>`:'<p class="hint">아직 기록이 없어요. 학습을 마치면 자동으로 기록됩니다.</p>'}
      <p class="hint" style="margin-top:14px;">💡 같은 글을 3번 읽는 <b>반복 읽기</b>는 읽기 유창성 지도의 핵심이에요. 1회와 3회 시간 차이, 그리고 날마다 줄어드는 더듬음 횟수를 확인해 보세요.</p>
      ${rows?'<button class="btn ghost sm" style="margin-top:10px;" onclick="resetRecords()">🗑 기록 초기화</button>':""}
    </div>`;
}

render(); loadRecords();
</script>
</body>
</html>
